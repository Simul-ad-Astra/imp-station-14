- type: entity
  parent: BaseKnife
  id: TailorsKnife
  name: tailor's knife
  description: A simple, wedge-shaped knife designed to cut fabric. Short, narrow, and lacking a grip entirely. It would be kind to leave this by the ClothesMate when you're done using it.
  components:
  - type: Tag
    tags:
    - Knife
  - type: MeleeWeapon #shiv stats
    attackRate: 1.5
    damage:
      types:
        Slash: 5.5
  - type: DisarmMalus
    malus: 0.225
  - type: ThrowingAngle
    angle: 200
  - type: Sprite
    sprite: _Impstation/Objects/Weapons/Melee/tailorsknife.rsi
    state: icon
  - type: Item
    sprite: _Impstation/Objects/Weapons/Melee/tailorsknife.rsi

- type: entity
  name: officer's dagger
  parent: [BaseSecurityCommandContraband, CombatKnife]
  id: OfficerKnife
  description: An expertly crafted gift from the Decapoid Empire, with a beauty to match its lethality.
  components:
  - type: Sprite
    sprite: _Impstation/Objects/Weapons/Melee/officer_knife.rsi
    state: icon
  - type: Item
    sprite: _Impstation/Objects/Weapons/Melee/officer_knife.rsi
    storedSprite:
      state: storage
      sprite: _Impstation/Objects/Weapons/Melee/officer_knife.rsi
  - type: ThrowingAngle
    angle: 225

- type: entity
  name: Xenoborg Blade
  parent: KukriKnife
  id: XenoborgKnife
  description: 4265 6520656666696369656E742E.
  components:
  - type: Sprite
    sprite: _Impstation/Objects/Weapons/Melee/xenoborg_blade.rsi
    state: icon
  - type: Item
    sprite: _Impstation/Objects/Weapons/Melee/xenoborg_blade.rsi
    storedSprite: null

- type: entity
  parent: BaseKnife
  id: KnifeThrowingGun
  name: Flash Print knife
  description: this one is a gun and also a knife. I don't like this one. I don't think it works well for what I'm going for
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Basic/kinetic_accelerator.rsi
  - type: Item
    sprite: Objects/Weapons/Guns/Basic/kinetic_accelerator.rsi
    size: Large
    shape:
    - 0,0,2,1
  - type: Gun
    fireRate: 4 # 0.5 -> 4, fire rate handled with recharge instead
    selectedMode: SemiAuto
    angleDecay: 45
    minAngle: 44
    maxAngle: 45
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/_Impstation/Weapons/Guns/Gunshots/kinetic_accel_full.ogg
    soundEmpty:
      path: /Audio/_Impstation/Weapons/Guns/Empty/dry_fire.ogg
      params:
        volume: -5
  - type: AmmoCounter
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.AmmoVisuals.HasAmmo:
        empty-icon:
          True: { visible: False }
          False: { visible: True }
        #todo: add other 'empty' animations
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 2
    rechargeSound:
      path: /Audio/_NF/Effects/silence.ogg # For some reason removing this part of the component makes it make a wizard sound instead of no sound???
  - type: BasicEntityAmmoProvider
    proto: BulletKinetic
    capacity: 1
    count: 1


